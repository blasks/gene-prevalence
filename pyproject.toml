[project]
name = "gene-prevalence"
version = "0.1.0"
description = "Model for estimating gene family prevalence from incomplete genomes"
authors = [
    {name = "blasks",email = "blasks@uw.edu"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14.1"
dependencies = [
    "jupyter (>=1.1.1,<2.0.0)",
    "numpy (>=2.3.4,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "scipy (>=1.16.3,<2.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "statsmodels (>=0.14.5,<0.15.0)",
    "geopandas (>=1.1.3,<2.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "gene_prevalence", from = "src"}]

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.2.0"
pytest = "^8.4.2"
sphinx = "^8.2.3"
numpydoc = "^1.9.0"
